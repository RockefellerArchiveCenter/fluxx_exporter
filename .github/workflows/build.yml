name: build distributions

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows
            runner: windows-latest
            spec: fluxx_exporter.spec
            artifact_suffix: windows
          - os: macos
            runner: macos-latest
            spec: fluxx_exporter-macos.spec
            artifact_suffix: macos-arm64
          - os: macos
            runner: macos-15-intel
            spec: fluxx_exporter-macos.spec
            artifact_suffix: macos-x64

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ github.event.release.tag_name || github.ref_name }}
      DIST_NAME: fluxx_exporter-${{ github.ref_name }}-${{ matrix.artifact_suffix }}

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Inject version into settings.py
        shell: bash
        run: |
          python - <<'EOF'
          from pathlib import Path
          import os
          import re

          path = Path("fluxx_exporter/settings.py")
          text = path.read_text()

          version = os.environ["APP_VERSION"]

          text = re.sub(
              r'^\s*APP_VERSION_NUMBER\s*=\s*.*$',
              f'APP_VERSION_NUMBER = "{version}"',
              text,
              flags=re.MULTILINE,
          )

          path.write_text(text)
          EOF

      - name: Build distribution (windows/linux)
        if: matrix.os != 'macos'
        run: pyinstaller ${{ matrix.spec }} --distpath ${{ env.DIST_NAME }}

      - name: Build macOS app bundle
        if: matrix.os == 'macos'
        run: pyinstaller ${{ matrix.spec }}

      - name: Show macOS app architecture
        if: matrix.os == 'macos'
        run: |
          file "dist/fluxx_exporter.app/Contents/MacOS/fluxx_exporter"

      - name: Sign Windows exe
        if: matrix.os == 'windows'
        uses: sslcom/esigner-codesign@v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ env.DIST_NAME }}/fluxx_exporter.exe
          output_path: signed
          override: false
          malware_block: true
          clean_logs: true

      - name: Create zip file (windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          Move-Item -Path "signed\fluxx_exporter.exe" -Destination "${{ env.DIST_NAME }}\fluxx_exporter.exe" -Force
          Remove-Item -Path "signed" -Recurse -Force
          Push-Location "${{ env.DIST_NAME }}"
          Compress-Archive -Path "fluxx_exporter.exe" -DestinationPath "..\${{ env.DIST_NAME }}.zip" -Force
          Pop-Location
          echo "RELEASE_FILE=${{ env.DIST_NAME }}.zip" >> $env:GITHUB_ENV

      - name: Import Apple signing certificate
        if: matrix.os == 'macos'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > certificate.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          security import certificate.p12 \
            -k build.keychain \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild

          security list-keychains -d user -s build.keychain login.keychain-db
          security default-keychain -d user -s build.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Sign macOS app bundle
        if: matrix.os == 'macos'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          codesign --force --deep --options runtime --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "dist/fluxx_exporter.app"

          codesign --verify --deep --strict --verbose=4 "dist/fluxx_exporter.app"

      - name: Create macOS DMG
        if: matrix.os == 'macos'
        run: |
          mkdir -p dmg-root
          cp -R "dist/fluxx_exporter.app" dmg-root/
          ln -s /Applications dmg-root/Applications

          hdiutil create \
            -volname "fluxx_exporter" \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            "${{ env.DIST_NAME }}.dmg"

      - name: Sign macOS DMG
        if: matrix.os == 'macos'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          codesign --force --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "${{ env.DIST_NAME }}.dmg"

          codesign --verify --verbose=2 "${{ env.DIST_NAME }}.dmg"

      - name: Notarize macOS DMG
        if: matrix.os == 'macos'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "${{ env.DIST_NAME }}.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Staple macOS DMG
        if: matrix.os == 'macos'
        run: |
          xcrun stapler staple "${{ env.DIST_NAME }}.dmg"

      - name: Validate stapled macOS DMG
        if: matrix.os == 'macos'
        run: |
          xcrun stapler validate "${{ env.DIST_NAME }}.dmg"
          spctl -a -t open --context context:primary-signature -vv "${{ env.DIST_NAME }}.dmg"
          echo "RELEASE_FILE=${{ env.DIST_NAME }}.dmg" >> "$GITHUB_ENV"

      - name: Check notarization history
        if: matrix.os == 'macos'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"

      - name: Cleanup Apple keychain files
        if: matrix.os == 'macos'
        run: |
          rm -f certificate.p12
          rm -rf dmg-root
          security delete-keychain build.keychain || true

      - uses: softprops/action-gh-release@v2.6.1
        if: github.ref_type == 'tag'
        with:
          files: ${{ env.RELEASE_FILE }}
