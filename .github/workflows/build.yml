name: build distributions
on:
  release:
    types: [published]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pyinstaller
        run: pip install pyinstaller

      - name: Build distribution
        run: pyinstaller fluxx_exporter.spec

      - uses: actions/upload-artifact@v4
        with:
          name: fluxx_exporter-${{ github.ref }}-linux
          path: dist/fluxx_exporter

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pyinstaller
        run: pip install pyinstaller

      - name: Build distribution
        run: pyinstaller fluxx_exporter.spec

      - uses: actions/upload-artifact@v4
        with:
          name: fluxx_exporter-${{ github.ref }}-macos
          path: dist/fluxx_exporter

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pyinstaller
        run: pip install pyinstaller

      - name: Build distribution
        run: pyinstaller fluxx_exporter.spec

      - uses: actions/upload-artifact@v4
        with:
          name: fluxx_exporter-${{ github.ref }}-windows
          path: dist/fluxx_exporter