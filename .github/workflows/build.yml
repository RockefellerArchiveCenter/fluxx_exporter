name: build distributions

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu, macos, windows]
    runs-on: ${{ matrix.os }}-latest
    permissions:
      contents: write
    env:
      DIST_NAME: fluxx_exporter-${{ github.ref_name }}-${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Build distribution
        run: pyinstaller fluxx_exporter.spec --distpath ${{ env.DIST_NAME }}

      - name: Sign Windows exe
        if: matrix.os == 'windows'
        uses: sslcom/esigner-codesign@v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ env.DIST_NAME }}/fluxx_exporter.exe
          output_path: signed
          override: false
          malware_block: true
          clean_logs: true

      - name: Create zip file (windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          Move-Item -Path "signed\fluxx_exporter.exe" -Destination "${{ env.DIST_NAME }}\fluxx_exporter.exe" -Force
          Remove-Item -Path "signed" -Recurse -Force
          Push-Location "${{ env.DIST_NAME }}"
          Compress-Archive -Path "fluxx_exporter.exe" -DestinationPath "..\${{ env.DIST_NAME }}.zip" -Force
          Pop-Location

      - name: Import Apple signing certificate
        if: matrix.os == 'macos'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > certificate.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          security import certificate.p12 \
            -k build.keychain \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security list-keychains -d user -s build.keychain login.keychain-db
          security default-keychain -d user -s build.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Sign macOS binary runtime
        if: matrix.os == 'macos'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          codesign --force --options runtime --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "${{ env.DIST_NAME }}/fluxx_exporter"

          codesign --verify --deep --strict --verbose=2 "${{ env.DIST_NAME }}/fluxx_exporter"

      - name: Package macOS artifact for notarization
        if: matrix.os == 'macos'
        run: |
          /usr/bin/ditto -c -k --keepParent \
            "${{ env.DIST_NAME }}" \
            "${{ env.DIST_NAME }}.zip"

      - name: Notarize macOS zip
        if: matrix.os == 'macos'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "${{ env.DIST_NAME }}.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Validate notarized macOS artifact
        if: matrix.os == 'macos'
        run: |
          unzip -q "${{ env.DIST_NAME }}.zip" -d notarization-check
          spctl -a -t exec -vv "notarization-check/${{ env.DIST_NAME }}/fluxx_exporter"

      - name: Cleanup Apple keychain files
        if: matrix.os == 'macos'
        run: |
          rm -f certificate.p12
          security delete-keychain build.keychain || true

      # ----------------------------
      # LINUX PACKAGING
      # ----------------------------
      - name: Create zip file (linux)
        if: matrix.os == 'ubuntu'
        run: |
          zip -r "${{ env.DIST_NAME }}.zip" "${{ env.DIST_NAME }}"

      - uses: softprops/action-gh-release@v2.5.0
        if: github.ref_type == 'tag'
        with:
          files: ${{ env.DIST_NAME }}.zip