{% load static %}
<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>{% block title %}Fluxx Exporter{% endblock %}</title>
		<link rel="icon" type="image/x-icon" href="https://assets.rockarch.org/assets/img/favicon.ico">
		<link rel="stylesheet" type="text/css" href="https://assets.rockarch.org/v0.12.0/main.min.css">
		<link rel="stylesheet" type="text/css" href="{% static 'css/styles.css' %}">
	</head>
	<body>
		<a href="#main" class="skip-link">Skip to main content</a>
		{% include 'exporter/includes/navbar.html' %}

		<div class="grid">
			<main id="main" class="content mb-50">
			{% include 'exporter/includes/messages.html' %}
			{% block content %}{% endblock content %}
			</main>
		</div>
		<script type="text/javascript" src="{% static 'js/nav-toggle.js' %}"></script>
	</body>
</html>
