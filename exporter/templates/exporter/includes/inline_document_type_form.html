{{ form.management_form }}
{{ form.non_form_errors }}

{% for error in form.non_field_errors %}
    <div class="input__error">{{error}}</div>
{% endfor %}
<div class="card card--container card--brown mb-10">
    <fieldset>
        <legend id="legend" class="mb-20">Available document types</legend>
            <div aria-describedby="legend" class="checkbox-list">
            {% for field in form %}
            <div class="input-group">
                {{field.id}}
                <input
                    type="checkbox"
                        class="checkbox checkbox--blue"
                        id="{{ field.include_in_export.auto_id }}"
                        name="{{ field.include_in_export.html_name }}"
                        {% if field.include_in_export.value %}checked="checked"{% endif %}
                />
                <label for="{{ field.name.id_for_label }}" class="checkbox--blue">
                    {{field.name.value}}
                </label>
                <input type="hidden" name="{{field.export_job.html_name}}" value={{field.export_job.value}} id="{{field.export_job.auto_id}}">
                <input type="hidden" name="{{field.id.html_name}}" value="{{field.id.value}}" id="{{field.id.auto_id}}">
                <input type="hidden" name="{{field.name.html_name}}" value="{{field.name.value}}" id="{{field.name.auto_id}}">
            </div>
            {% endfor %}
        </div>
    </fieldset>
</div>
